# AMD ROCm GPU overlay. Enable by setting COMPOSE_FILE in .env:
#   COMPOSE_FILE=docker/compose.yml:docker/gpu.amd.yml
#   RENDER_GID=<numeric output of: getent group render | cut -d: -f3>
#
# Requires ROCm drivers on the host (kfd + DRI devices). The host user
# running Docker must be in the `video` and `render` groups.
#
# This overlay only exposes host ROCm/KFD/DRI devices to Atenea.
# Atenea setup then installs/downloads a prebuilt llama.cpp runtime inside
# the container (ROCm when available, else safe fallback paths).
services:
  atenea:
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - ${RENDER_GID:-render}
