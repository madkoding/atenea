[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config --maxfail=1 --cov=app --cov=core --cov=routes --cov=src --cov=services --cov-report=term-missing:skip-covered"

[tool.coverage.run]
branch = true
source = ["app", "core", "routes", "src", "services"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "data",
    "docs",
    "static/lib",
    "venv",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
pretty = true
follow_imports = "skip"
no_implicit_optional = false
files = [
    "src/constants.py",
    "core/constants.py",
    "src/runtime/app_helpers.py",
]
